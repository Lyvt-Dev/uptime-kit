services:
  api:
    build: ./apps/api
    environment:
      DATABASE_PATH: /data/uptime.db
      MONITORS_JSON: ${MONITORS_JSON:-[]}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      PORT: 3001
    volumes:
      - sqlite_data:/data
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
  web:
    build: ./apps/web
    environment:
      API_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  sqlite_data:
